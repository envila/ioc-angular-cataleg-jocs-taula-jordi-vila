<section class="llista-jocs" aria-label="Catàleg de jocs de taula">
  @if (jocs.length > 0) {
    @for (joc of jocs; track joc.id) {
      <button
        type="button"
        class="boto-targeta"
        [attr.aria-label]="'Selecciona el joc ' + joc.titol"
        (click)="seleccionarJoc(joc)"
      >
        <app-targeta-joc [joc]="joc" />
      </button>
    }
  } @else {
    <p class="missatge-buit">No s'han trobat jocs de taula.</p>
  }
</section>
